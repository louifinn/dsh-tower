name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offline suite
        run: npm test
      - name: Documentation consistency
        run: npm run docs:check
      - name: Generated error reference
        run: npm run docs:check:generated
      - name: Generated tools reference
        run: npm run docs:check:generated:tools
      - name: Pack manifest
        run: npm run pack:check
      - name: Architecture fitness
        run: npm run architecture:check
