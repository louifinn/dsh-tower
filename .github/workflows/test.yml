name: test

on:
  push:
  pull_request:
  # #47: the live suite needs a browser download and a real DSH server boot, so
  # it is nightly-only (and manually runnable). It never gates a push/PR.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# #M72: least privilege by default. The workflow token starts read-only; the
# nightly failure reporter is the only job that writes and it opts into
# `issues: write` on the job itself, so a push/PR step cannot edit issues.
permissions:
  contents: read

# #M72: one run per ref *and event class*. A push and the nightly schedule both
# use refs/heads/main, so an event-qualified group keeps a push from cancelling
# an in-flight scheduled run (and vice versa); only pushes/PRs cancel their own
# superseded run, so the nightly evidence and its issue report always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  # #M72: the canonical gate. Each supported runtime leg runs exactly one
  # `npm run check` — the same command CONTRIBUTING tells a human to run — so
  # the CI gate cannot drift from package.json. These contexts are named for
  # the supported runtime (`test (24.9)`, `test (25)`, `test (24.9, windows)`)
  # and, together with the `mount` job below, are the four required contexts in
  # docs/operations/ci.md; the branch-protection cutover is complete.
  #
  # The extra reports after the canonical gate are CI-only and Node-24-only:
  # the tag-only release check (#97), the coverage table (#81), and the live
  # harness environment/Playwright resolution check (#87, no browser, no host).
  canonical:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.9'
            release: true
            label: test (24.9)
          - os: ubuntu-latest
            node: '25'
            release: false
            label: test (25)
          - os: windows-latest
            node: '24.9'
            release: false
            label: test (24.9, windows)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # #M72/R90: the Node 24.9 leg also runs `npm run release:check`, which
          # resolves the previous release with `git describe --tags`; a shallow
          # clone hides the tags and degrades a tag violation to a no-baseline
          # warning. Full history here keeps the tags visible.
          fetch-depth: 0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Canonical gate (npm run check)
        run: npm run check
      # #47: keep the TMPDIR/DSH_HOME pairing; the guard rejects a home that is
      # not below os.tmpdir(), and TMPDIR makes both name the same root.
      - name: Live harness check (environment + Playwright resolution, no browser)
        if: matrix.release
        env:
          DSH_LIVE: '1'
          TMPDIR: ${{ runner.temp }}
          DSH_HOME: ${{ runner.temp }}/dsh-live-check
        run: |
          mkdir -p "$DSH_HOME"
          npm run test:live -- --check
      - name: Release check
        if: matrix.release
        run: npm run release:check
      - name: Coverage (Node 24.9)
        if: matrix.release
        run: npm run test:coverage

  # #95: does the packed bundle mount and register what it claims?
  # Node >=24.9 (the pinned host floor; cost control); no model, no browser.
  # The host build is the single pin in scripts/mount-smoke/host.json, which a
  # unit test keeps equal to the newest COMPATIBILITY.md row.
  mount:
    name: mount
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '24.9'
      - name: Install pnpm (the plugin CLI's package manager)
        run: npm install --global pnpm@$(node -p "require('./scripts/mount-smoke/host.json').pnpm")
      - name: Mount the packed bundle in a throwaway profile
        run: npm run smoke:mount
        # The step budget is 3 minutes; the whole job allows 5.
        timeout-minutes: 3

  # #95: the seeded-failure proof, not only the green run. The control plus both
  # seeds each run the real smoke against a copy, so one cached host install is
  # shared through --host-dir instead of three installs. Evidence only, never a
  # merge gate: the required contexts are `mount`, `test (24.9)`, `test (25)`
  # and `test (24.9, windows)`.
  mount-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '24.9'
      - name: Install pnpm (the plugin CLI's package manager)
        run: npm install --global pnpm@$(node -p "require('./scripts/mount-smoke/host.json').pnpm")
      - name: Cache the pinned host install
        # #M72/R90: SHA-pinned like every other action; tests/mount-smoke.test.mjs
        # requires this exact form.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/dsh-tower/mount-host
          key: dsh-tower-mount-host-${{ runner.os }}-${{ hashFiles('scripts/mount-smoke/host.json') }}
      - name: Seeded failure fixtures
        run: npm run smoke:fixtures -- --host-dir "$HOME/.cache/dsh-tower/mount-host"
        timeout-minutes: 6

  # #47 / #87: the live Playwright suite runs nightly (and on manual dispatch),
  # never on push or pull_request. It installs the live harness from its own
  # lockfile, boots a real @deepseek-ai/dsh Web runtime pinned by the matrix, and
  # proves the composition with one browser script. The pin is a matrix value so
  # bumping the host is a visible one-line diff; tests/live-harness.test.mjs keeps
  # it equal to scripts/mount-smoke/host.json and the newest COMPATIBILITY row,
  # and scripts/check-support.mjs keeps it equal to scripts/support.json.
  live:
    name: live (${{ matrix.dsh }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - '0.2.2-rc.1'
    env:
      DSH_LIVE: '1'
      DSH_HOST_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '24.9'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The reproducible live setup (#87): the package pinned in
      # tests/live/package-lock.json, then the browser explicitly.
      - name: Install the live harness (Playwright package, no browser)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix tests/live
      - name: Install Chromium for Playwright
        run: npx --prefix tests/live playwright install --with-deps chromium
      - name: Install pnpm (the plugin CLI's package manager)
        run: npm install --global pnpm@$(node -p "require('./scripts/mount-smoke/host.json').pnpm")
      - name: Install the pinned host
        run: npm install --prefix "$RUNNER_TEMP/dsh-host" --no-save --no-audit --no-fund --ignore-scripts "@deepseek-ai/dsh@${{ matrix.dsh }}"
      # The first output line names the resolved DSH_HOME and host version (#47).
      - name: Provision the isolated profile, boot it and run the live smoke
        env:
          DSH_HOST_DIR: ${{ runner.temp }}/dsh-host
          DSH_REPO: ${{ github.workspace }}
          # #47: same contract as the push-level check above — os.tmpdir() must equal
          # runner.temp for the guard to accept DSH_HOME under it. runner context is
          # step-only, so these live here, not at job level (invalid workflow otherwise).
          TMPDIR: ${{ runner.temp }}
          DSH_HOME: ${{ runner.temp }}/dsh-live-home
        run: |
          mkdir -p "$DSH_HOME"
          npm run test:live -- --script nightly
      # #47: the 5/5 nightly boot-smoke failures reported only booleans, and CI
      # kept no artifacts. Upload the screenshot and the log unconditionally so
      # a red nightly is diagnosable from the run page. Short retention: this is
      # failure evidence, not a durable product.
      - name: Upload live boot diagnostics
        if: always()
        # #M72/R90: SHA-pinned like every other action; tests/live-harness.test.mjs
        # requires this job's single artifact upload in this pinned form.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-boot-diagnostics
          path: |
            tests/live/boot-smoke.png
            tests/live/boot-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  # #130: the long property tier - 2000 runs on one seed drawn from
  # `node:crypto`. It is nightly/manual-only (same gate as `live`), so a random
  # seed never reds a push/PR. On failure the harness writes seed/path/
  # counterexample JSON under tests/property/.artifacts/; upload it so the
  # failure is replayable from the run page. Evidence only, never a merge gate:
  # the required contexts are `mount`, `test (24.9)`, `test (25)` and
  # `test (24.9, windows)`.
  property-long:
    name: property-long
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '24.9'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Property tests (long tier)
        run: npm run test:property:long
      - name: Upload property failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: property-artifacts
          path: tests/property/.artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # #M72: one issue per repository, not one issue per failure. Runs only on the
  # nightly schedule and only when a gated job failed; it lists the failing job
  # display names and the run URL. `issues: write` is granted to this job alone
  # (the token is the workflow token, never a personal one), and `actions: read`
  # is what the jobs API needs to name the failures.
  nightly-failure:
    name: nightly failure report
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs:
      - canonical
      - mount
      - mount-fixtures
      - live
      - property-long
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Open or update the single nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # runner.temp is empty on this job, so build the URL from the run id.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failing=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | unique | join(", ")')
          if [ -z "$failing" ]; then
            failing="unknown (the jobs API reported no failed job)"
          fi
          body=$(printf 'The scheduled `%s` workflow failed.\n\nRun: %s\n\nFailing jobs: %s\n\nThis issue is updated in place by the `nightly-failure` job; it is one issue per repository, not one issue per failure.\n' "$GITHUB_WORKFLOW" "$RUN_URL" "$failing")
          number=$(gh issue list --state open --search 'in:title "Nightly test workflow failure"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Nightly test workflow failure" --body "$body"
          fi
