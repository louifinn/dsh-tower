name: test

on:
  push:
  pull_request:
  # #47: the live suite needs a browser download and a real DSH server boot, so
  # it is nightly-only (and manually runnable). It never gates a push/PR.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  # #86: the platform branches get a real OS, not only a Linux runner.
  # The required contexts are exactly `test (22)`, `test (24)` and `mount`
  # (branch protection matches the string byte for byte). Each leg therefore
  # carries its full context in `matrix.name`; do not add an `os` matrix key
  # without one, or GitHub would rename the checks to `test (22, ubuntu-latest)`
  # and protected `main` would never merge again.
  #
  # Windows is Node 22 only: the leg exists for platform coverage, not for a
  # second Node matrix. It runs the offline suite and the offline gates, and
  # skips the Node 22 Ubuntu-only release and coverage steps.
  test:
    name: ${{ matrix.name }}
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test (22)
            os: ubuntu-latest
            node: 22
          - name: test (24)
            os: ubuntu-latest
            node: 24
          - name: test (22, windows)
            os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gate compares the version against tags; a shallow clone
          # would make every branch look untagged.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offline suite (includes protocol end-to-end)
        run: npm test
      # #87: the resolver/env half of the live harness is cheap even on a clean
      # clone (no tests/live/node_modules, no browser). It catches a rotted
      # harness on every push while the browser run stays nightly (#47).
      - name: Live harness check (environment + Playwright resolution, no browser)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          DSH_LIVE: '1'
          # #47: the guard only accepts a DSH_HOME below os.tmpdir(). On the
          # Ubuntu runner os.tmpdir() defaults to /tmp while runner.temp is
          # /home/runner/work/_temp, so point TMPDIR at runner.temp here: both
          # then name the same root and the guard accepts the home. Keep TMPDIR
          # next to DSH_HOME; tests/live-harness.test.mjs asserts this pairing.
          TMPDIR: ${{ runner.temp }}
          DSH_HOME: ${{ runner.temp }}/dsh-live-check
        run: |
          mkdir -p "$DSH_HOME"
          npm run test:live -- --check
      # #97: warn on PR/branch pushes, fail on a tag push when the version did
      # not move or the tag is not v<version>. One leg is enough to report it.
      - name: Release check
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run release:check
      # Wiring only (#81): no thresholds, no baseline, no badge. The coverage
      # table is the visible result; one leg is enough to produce it.
      - name: Coverage (Node 22)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage
      - name: Documentation consistency
        run: npm run docs:check
      - name: Generated error reference
        run: npm run docs:check:generated
      - name: Generated tools reference
        run: npm run docs:check:generated:tools
      - name: Generated config reference
        run: npm run docs:check:generated:config
      - name: Generated events reference
        run: npm run docs:check:generated:events
      # #115: the published type vocabulary (ErrorCode, MissionStatus,
      # ReviewStatus, ...) is generated from the runtime constants, so a catalog
      # change without regenerating types/index.d.ts is a red check.
      - name: Generated type vocabulary
        run: npm run docs:check:generated:types
      # #120: the component table is generated from scripts/component-surface.json,
      # so "should this be a component?" is a table lookup rather than prose.
      - name: Generated component surface
        run: npm run docs:check:generated:components
      # #121: an optional capability row and both preset-declaring rows label
      # themselves on the Plugins page from their own
      # `<specifier>/locale/<lang>.json`, generated from the shared locale
      # components block; a hand edit is a red check.
      - name: Generated row locales
        run: npm run docs:check:generated:locale
      # #120: locale coverage, the forbidden-to-disable denylist, and the baselined
      # component count. Principle 11 has no teeth without this step.
      - name: Component surface policy
        run: npm run docs:check:components
      # #83: every principle's enforcement pointer must resolve, the ADR set must
      # stay dated and structured, and docs/ "Non-goals" must be auditable.
      - name: Engineering philosophy
        run: npm run docs:check:philosophy
      # #84: a config key or tool may grow only with an ADR or a matching deletion.
      - name: Surface budget
        run: npm run surface:check
      - name: Pack manifest
        run: npm run pack:check
      - name: Architecture fitness
        run: npm run architecture:check
      # #115: the checked program is derived from the shipped program, so a
      # runtime .js file outside the tsc program is a red check.
      - name: Type coverage
        run: npm run types:coverage
      # #115: the noImplicitAny ratchet may grow but never silently shrink.
      - name: Strict type ratchet
        run: npm run types:strict:check
      # Both configs: the main checkJs program and tsconfig.strict.json.
      - name: Type declarations
        run: npm run types:check
      - name: Pure domain share
        run: npm run domain:check

  # #95: does the packed bundle mount and register what it claims?
  # Node 22 only (cost control); no model, no browser.
  # The host build is the single pin in scripts/mount-smoke/host.json, which a
  # unit test keeps equal to the newest COMPATIBILITY.md row.
  mount:
    name: mount
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm (the plugin CLI's package manager)
        run: npm install --global pnpm@$(node -p "require('./scripts/mount-smoke/host.json').pnpm")
      - name: Mount the packed bundle in a throwaway profile
        run: npm run smoke:mount
        # The step budget is 3 minutes; the whole job allows 5.
        timeout-minutes: 3

  # #95: the seeded-failure proof, not only the green run. The control plus both
  # seeds each run the real smoke against a copy, so one cached host install is
  # shared through --host-dir instead of three installs. Evidence only, never a
  # merge gate: the required contexts stay `test (22)`, `test (24)` and `mount`.
  mount-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm (the plugin CLI's package manager)
        run: npm install --global pnpm@$(node -p "require('./scripts/mount-smoke/host.json').pnpm")
      - name: Cache the pinned host install
        uses: actions/cache@v4
        with:
          path: ~/.cache/dsh-tower/mount-host
          key: dsh-tower-mount-host-${{ runner.os }}-${{ hashFiles('scripts/mount-smoke/host.json') }}
      - name: Seeded failure fixtures
        run: npm run smoke:fixtures -- --host-dir "$HOME/.cache/dsh-tower/mount-host"
        timeout-minutes: 6

  # #47 / #87: the live Playwright suite runs nightly (and on manual dispatch),
  # never on push or pull_request. It installs the live harness from its own
  # lockfile, boots a real @deepseek-ai/dsh Web runtime pinned by the matrix, and
  # proves the composition with one browser script. The pin is a matrix value so
  # bumping the host is a visible one-line diff; tests/live-harness.test.mjs keeps
  # it equal to scripts/mount-smoke/host.json and the newest COMPATIBILITY row.
  live:
    name: live (${{ matrix.dsh }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - '0.2.1-rc.2'
    env:
      DSH_LIVE: '1'
      DSH_HOST_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      # The reproducible live setup (#87): the package pinned in
      # tests/live/package-lock.json, then the browser explicitly.
      - name: Install the live harness (Playwright package, no browser)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix tests/live
      - name: Install Chromium for Playwright
        run: npx --prefix tests/live playwright install --with-deps chromium
      - name: Install pnpm (the plugin CLI's package manager)
        run: npm install --global pnpm@$(node -p "require('./scripts/mount-smoke/host.json').pnpm")
      - name: Install the pinned host
        run: npm install --prefix "$RUNNER_TEMP/dsh-host" --no-save --no-audit --no-fund --ignore-scripts "@deepseek-ai/dsh@${{ matrix.dsh }}"
      # The first output line names the resolved DSH_HOME and host version (#47).
      - name: Provision the isolated profile, boot it and run the live smoke
        env:
          DSH_HOST_DIR: ${{ runner.temp }}/dsh-host
          DSH_REPO: ${{ github.workspace }}
          # #47: same contract as the push-level check above — os.tmpdir() must equal
          # runner.temp for the guard to accept DSH_HOME under it. runner context is
          # step-only, so these live here, not at job level (invalid workflow otherwise).
          TMPDIR: ${{ runner.temp }}
          DSH_HOME: ${{ runner.temp }}/dsh-live-home
        run: |
          mkdir -p "$DSH_HOME"
          npm run test:live -- --script nightly

