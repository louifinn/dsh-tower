# dsh-tower component rows (#121).
#
# The first top-level row is the mandatory host group: the Host plugin and its
# worker-preset dependency. Turning it off equals uninstalling Tower (no tools,
# no presets, no skills), which is the accepted all-off boundary; every other
# top-level row is an individually switchable optional capability whose off
# state leaves the rest of Tower working.
#
# Policy: principle 11 in PRINCIPLES.md + docs/adr/0005-component-surface.md.
# The per-key answer is docs/reference/component-surface.md, generated from
# scripts/component-surface.json. `npm run docs:check:components` refuses a new
# switch, a missing locale label, or a moved component count without a written
# decision. `tower_doctor` and `tower_recover` are part of the host and are never
# switches (#122); a capability row owns exactly one optional capability, and
# `tower_status` / `tower_doctor` name any row that is off.
- insert:
    # Mandatory host anchor. Not an optional capability: off == uninstall.
    - id: tower
      name: cordis:group
      group: true
      config:
        - id: tower-host
          name: 'dsh-tower'
          config:
            mode:
              allowAgentControl: true
              workspaceLock: true
              workspaceLockScope: all
              planModePolicy: clear
            init:
              autoGitInit: true
            send:
              interruptDefault: true
            spawn:
              staleMs: 15000
        # Each preset row mounts its own Tower-owned declaration module, not the
        # shared @deepseek-ai/dsh-agent-preset: DSH labels a row from
        # <specifier>/locale/<lang>.json, so two rows sharing one module would
        # render the same title. The row config is unchanged.
        - id: preset-tower-worker
          name: 'dsh-tower/preset-worker'
          config:
            id: tower-worker
            name: Tower Worker
            description: Executes one Tower mission inside its assigned git worktree.
            order: 60
            plugins:
              - id: tower-worker-policy
                name: 'dsh-tower/worker'
              - id: tower-worker-fs
                name: '@deepseek-ai/dsh-tool-fs'
              - id: tower-worker-fs-search
                name: '@deepseek-ai/dsh-tool-fs-search'
                config:
                  sampleOverCapGlobResults: false
              - id: tower-worker-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
    # Optional capabilities: each row is the switch for exactly one capability.
    - id: tower-skills
      name: 'dsh-tower/skills'
    - id: tower-batch
      name: 'dsh-tower/batch'
    - id: tower-import
      name: 'dsh-tower/import'
    - id: tower-leases
      name: 'dsh-tower/leases'
    - id: tower-tests
      name: 'dsh-tower/tests'
    # dev hot reload: shipped off. Enable the row for a linked dev profile.
    - id: tower-hmr
      name: 'dsh-tower/hmr'
      disabled: true
    # Conditional optional component: off is supported only while
    # review.requireReview is false; with the gate on planning/mode entry refuse
    # the combination with an explanatory error.
    - id: preset-tower-reviewer
      name: 'dsh-tower/preset-reviewer'
      config:
        id: tower-reviewer
        name: Tower Reviewer
        description: Read-only independent reviewer for a completed Tower mission.
        order: 61
        plugins:
          - id: tower-reviewer-policy
            name: 'dsh-tower/reviewer'
          - id: tower-reviewer-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              readImage: false
          - id: tower-reviewer-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
